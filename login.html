<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    :root { --bg:#f5f7fb; --card:#ffffff; --muted:#5b6b86; --text:#0f172a; --border:#e2e8f0; --accent:#2563eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background: radial-gradient(1200px 800px at 20% 0%, #ffffff 0%, var(--bg) 60%); color: var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background: var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; width:100%; max-width:360px; }
    h1 { margin:0 0 12px; font-size:20px; }
    label { display:block; font-size:13px; color:var(--muted); margin-top:10px; }
    input { width:100%; padding:10px; border:1px solid var(--border); border-radius:10px; margin-top:6px; }
    button { margin-top:16px; width:100%; padding:10px; border-radius:10px; background:#2563eb; color:white; border:0; cursor:pointer; }
    .err { color:#b91c1c; font-size:13px; margin-top:8px; }
    .muted { color: var(--muted); font-size: 13px; margin-top: 10px; text-align:center; }
  </style>
  </head>
<body>
  <div class="card">
    <h1>Sign in</h1>
    <label for="name">Name</label>
    <input id="name" type="text" placeholder="e.g. Alice Murphy" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••" />
    <button id="loginBtn" type="button">Login</button>
    <div id="err" class="err" style="display:none"></div>
    <div class="muted"><a href="/groups.html">Back to Groups</a></div>
  </div>
  <script>
    const LOGIN_URL = 'http://127.0.0.1:5001/api/login';
    const ME_URL = 'http://127.0.0.1:5001/api/me';
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value.trim();
      const err = document.getElementById('err');
      err.style.display = 'none';
      try {
        console.debug('[login] sending', { name });
        const r = await fetch(LOGIN_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name, password })
        });
        console.debug('[login] response', r.status, r.statusText);
        if (!r.ok) {
          let j = {};
          try { j = await r.json(); } catch {}
          console.debug('[login] error body', j);
          throw new Error(j.error || `Login failed (${r.status})`);
        }
        console.debug('[login] success, redirecting');
        location.href = '/groups.html';
      } catch (e) {
        err.textContent = e.message || 'Login failed';
        err.style.display = 'block';
        console.debug('[login] exception', e);
      }
    });

    (async function(){
      try {
        console.debug('[me] checking session');
        const r = await fetch(ME_URL, { credentials: 'include' });
        console.debug('[me] response', r.status);
        const me = await r.json();
        console.debug('[me] body', me);
        if (me && me.loggedIn) location.href = '/groups.html';
      } catch {}
    })();
  </script>
</body>
</html>
